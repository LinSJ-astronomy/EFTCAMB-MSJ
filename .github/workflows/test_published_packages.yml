name: Test published packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published eftcamb version to test
        required: true
        type: string
      index:
        description: Package index
        required: true
        default: pypi
        type: choice
        options: [pypi, testpypi]

permissions:
  contents: read

jobs:
  test-published-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies from PyPI
        run: python -m pip install numpy scipy sympy packaging 'camb==1.6.5'
      - name: Install requested eftcamb wheel
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PACKAGE_INDEX: ${{ inputs.index }}
        run: |
          index_url=https://pypi.org/simple/
          if [ "$PACKAGE_INDEX" = testpypi ]; then index_url=https://test.pypi.org/simple/; fi
          python -m pip install --only-binary=:all: --no-deps --index-url "$index_url" "eftcamb==$RELEASE_VERSION"
      - name: Verify installed release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -c "import importlib.metadata, os, eftcamb; expected=os.environ['RELEASE_VERSION']; assert eftcamb.__version__ == expected; assert importlib.metadata.version('eftcamb') == expected"
          python -m unittest eftcamb.tests.release_test
          eftcamb --version
