name: Python tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libblas-dev liblapack-dev
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' 'camb==1.6.5'
      - name: Run Python tests
        env:
          OMP_NUM_THREADS: "1"
        run: |
          python -m unittest eftcamb.tests.camb_test eftcamb.tests.mathutils_test eftcamb.tests.release_test
          python -c "import os, subprocess, sys; subprocess.run([sys.executable, '-m', 'unittest', 'eftcamb.tests.camb_test_slow'], check=True) if not os.getenv('CAMB_TEST_FAST') else None"
