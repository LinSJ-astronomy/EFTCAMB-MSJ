name: Wheels

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Upload validated artifacts to this index
        required: true
        default: none
        type: choice
        options: [none, testpypi, pypi]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up macOS compiler
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          echo "$(brew --prefix gcc)/bin" >> "$GITHUB_PATH"
      - name: Install build frontend
        run: python -m pip install --upgrade cibuildwheel
      - name: Build platform wheel
        env:
          # The ctypes library is independent of CPython's extension ABI.
          CIBW_BUILD: cp312-*
          CIBW_SKIP: "pp* *-manylinux_i686 *musllinux*"
          CIBW_BUILD_VERBOSITY: 1
          # Keep binary installs available on glibc 2.17 servers as well.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_BEFORE_BUILD_LINUX: yum install -y blas-devel lapack-devel
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test_wheels:
    name: Install wheel on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse
      - name: Install and test wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/wheelhouse/*.whl 'camb==1.6.5' twine
          python -m twine check --strict "$GITHUB_WORKSPACE"/wheelhouse/*.whl
          python -c "import importlib.metadata, eftcamb; assert importlib.metadata.version('eftcamb') == eftcamb.__version__; print(eftcamb.__file__, eftcamb.__version__)"
          python -m unittest eftcamb.tests.release_test
          eftcamb --version
          eftcamb check_accuracy --help

  test_sdist:
    name: Install source distribution on ${{ matrix.os }}
    needs: build_sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libblas-dev liblapack-dev
      - name: Set up macOS compiler
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          echo "$(brew --prefix gcc)/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Install and test source distribution outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz 'camb==1.6.5'
          python -c "import importlib.metadata, eftcamb; assert importlib.metadata.version('eftcamb') == eftcamb.__version__; print(eftcamb.__file__, eftcamb.__version__)"
          python -m unittest eftcamb.tests.release_test
          eftcamb --version

  publish:
    needs: [test_wheels, test_sdist]
    # Trusted Publishing must be configured for the selected repository and workflow.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.repository == 'LinSJ-astronomy/EFTCAMB-MSJ' || github.repository == 'EFTCAMB/EFTCAMB') &&
      (inputs.publish_target == 'testpypi' ||
       (inputs.publish_target == 'pypi' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Check artifacts before upload
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*
      - name: Publish to TestPyPI
        if: inputs.publish_target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.publish_target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
