name: Wheels

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Upload validated artifacts to this index
        required: true
        default: none
        type: choice
        options: [none, testpypi, pypi]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up macOS compiler
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          echo "$(brew --prefix gcc)/bin" >> "$GITHUB_PATH"
      - name: Install build frontend
        run: python -m pip install --upgrade cibuildwheel
      - name: Build platform wheel
        env:
          # The ctypes library is independent of CPython's extension ABI.
          CIBW_BUILD: cp312-*
          CIBW_SKIP: "pp* *-manylinux_i686 *musllinux*"
          CIBW_BUILD_VERBOSITY: 1
          # Keep binary installs available on glibc 2.17 servers as well.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          # EFTCAMB change Start
          # GCC 14 provides heap trampolines while the sysroot retains glibc 2.17 support.
          CIBW_BEFORE_ALL_LINUX: |
            set -eu
            case "$(uname -m)" in
              x86_64) subdir=linux-64; triplet=x86_64-conda-linux-gnu ;;
              aarch64) subdir=linux-aarch64; triplet=aarch64-conda-linux-gnu ;;
              *) exit 1 ;;
            esac
            mkdir -p /opt/eftcamb-micromamba
            curl -fLsS "https://micro.mamba.pm/api/micromamba/${subdir}/latest" -o /tmp/eftcamb-micromamba.tar.bz2
            tar -xjf /tmp/eftcamb-micromamba.tar.bz2 -C /opt/eftcamb-micromamba bin/micromamba
            MAMBA_ROOT_PREFIX=/opt/eftcamb-micromamba /opt/eftcamb-micromamba/bin/micromamba create -y \
              -p /opt/eftcamb-toolchain --override-channels -c conda-forge \
              "gcc_impl_${subdir}=14.*" "gfortran_impl_${subdir}=14.*" \
              "libgcc-devel_${subdir}=14.*" "sysroot_${subdir}=2.17" \
              "libgcc=14.*" "libstdcxx=14.*" "libgfortran5=14.*" "libgomp=14.*"
            ln -sf "${triplet}-gfortran" /opt/eftcamb-toolchain/bin/gfortran
            /opt/eftcamb-toolchain/bin/gfortran --version
            test -f "$(/opt/eftcamb-toolchain/bin/gfortran -print-file-name=libgcc_eh.a)"
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="/opt/eftcamb-toolchain/bin:$PATH"
            LD_LIBRARY_PATH="/opt/eftcamb-toolchain/lib:$LD_LIBRARY_PATH"
            LIBRARY_PATH="/usr/lib64:$LIBRARY_PATH"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --plat manylinux2014_$(uname -m) -w {dest_dir} {wheel}
          # CAMB 1.6.5 Linux wheels need newer glibc; keep the old-system coexistence check on 1.6.0.
          CIBW_TEST_REQUIRES_LINUX: "camb==1.6.0"
          # Select NumPy/SciPy wheels compatible with the container's older glibc.
          CIBW_TEST_ENVIRONMENT_LINUX: "PIP_ONLY_BINARY='numpy,scipy'"
          CIBW_TEST_COMMAND_LINUX: "python -m unittest eftcamb.tests.release_test"
          # EFTCAMB change End
          CIBW_BEFORE_BUILD_LINUX: yum install -y blas-devel lapack-devel
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: python -m cibuildwheel --output-dir wheelhouse
      # EFTCAMB change Start
      - name: Check Linux wheels do not require an executable stack
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          import pathlib
          import struct
          import zipfile

          for wheel in pathlib.Path("wheelhouse").glob("*.whl"):
              assert "manylinux2014_" in wheel.name, wheel.name
              checked = 0
              with zipfile.ZipFile(wheel) as archive:
                  for name in archive.namelist():
                      if ".so" not in pathlib.PurePosixPath(name).name:
                          continue
                      data = archive.read(name)
                      if not data.startswith(b"\x7fELF"):
                          continue
                      assert data[4] == 2, (name, "expected 64-bit ELF")
                      endian = "<" if data[5] == 1 else ">"
                      offset = struct.unpack_from(endian + "Q", data, 32)[0]
                      size, count = struct.unpack_from(endian + "HH", data, 54)
                      headers = [struct.unpack_from(endian + "II", data, offset + i * size) for i in range(count)]
                      stack = [flags for kind, flags in headers if kind == 0x6474E551]
                      assert stack and all(not flags & 1 for flags in stack), (name, "executable or unspecified stack")
                      checked += 1
              assert checked, (wheel.name, "no ELF libraries found")
              print(f"{wheel.name}: checked {checked} ELF libraries")
          PY
      # EFTCAMB change End
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test_wheels:
    name: Install wheel on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse
      - name: Install and test wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/wheelhouse/*.whl 'camb==1.6.5' twine
          python -m twine check --strict "$GITHUB_WORKSPACE"/wheelhouse/*.whl
          python -c "import importlib.metadata, eftcamb; assert importlib.metadata.version('eftcamb') == eftcamb.__version__; print(eftcamb.__file__, eftcamb.__version__)"
          python -m unittest eftcamb.tests.release_test
          eftcamb --version
          eftcamb check_accuracy --help

  test_sdist:
    name: Install source distribution on ${{ matrix.os }}
    needs: build_sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libblas-dev liblapack-dev
      - name: Set up macOS compiler
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          echo "$(brew --prefix gcc)/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Install and test source distribution outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz 'camb==1.6.5'
          python -c "import importlib.metadata, eftcamb; assert importlib.metadata.version('eftcamb') == eftcamb.__version__; print(eftcamb.__file__, eftcamb.__version__)"
          python -m unittest eftcamb.tests.release_test
          eftcamb --version

  publish:
    needs: [test_wheels, test_sdist]
    # Trusted Publishing must be configured for the selected repository and workflow.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.repository == 'LinSJ-astronomy/EFTCAMB-MSJ' || github.repository == 'EFTCAMB/EFTCAMB') &&
      (inputs.publish_target == 'testpypi' ||
       (inputs.publish_target == 'pypi' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Check artifacts before upload
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*
      - name: Publish to TestPyPI
        if: inputs.publish_target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.publish_target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
