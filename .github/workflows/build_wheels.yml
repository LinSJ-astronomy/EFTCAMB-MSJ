name: Wheels

on:
  push:
  pull_request:
  # EFTCAMB MOD START: allow explicit TestPyPI/PyPI publication without publishing on every push.
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Upload validated artifacts to this index"
        required: true
        default: "none"
        type: choice
        options: [none, testpypi, pypi]
      release_version:
        description: "Exact version to reinstall from TestPyPI"
        required: false
        default: "1.6.5"
        type: string
  # EFTCAMB MOD END

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    # EFTCAMB MOD START: build artifacts for every push and pull request so release changes are tested before tagging.
    # The former commit-message/tag gate skipped the CI checks required for an H-EFTCAMB release PR.
    # EFTCAMB MOD END
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # see https://github.com/actions/runner-images/tree/main
        os:
          [
            macos-13,
            macos-13-xlarge,
            macos-14,
            ubuntu-latest,
            ubuntu-24.04-arm,
            # windows-latest,
          ]
    steps:
      - run: ln -s $(which gfortran-12) /usr/local/bin/gfortran
        if: startsWith(matrix.os, 'ubuntu')

      - run: ln -s $(which gfortran-14) /usr/local/bin/gfortran
        if: startsWith(matrix.os, 'macos')

      - run: gfortran --version

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        # EFTCAMB MOD START: upgrade the build frontend so all requested CPython wheel tags are available.
        run: python -m pip install --upgrade pip cibuildwheel
        # EFTCAMB MOD END

      - name: Build macos-13 wheels
        if: matrix.os == 'macos-13' || matrix.os == 'macos-13-xlarge'
        env:
          MACOSX_DEPLOYMENT_TARGET: 13
          # EFTCAMB MOD START: build once with CPython 3.12; setup.py deliberately tags this native-library wheel as py3-none.
          # The validation job below installs that same wheel on Python 3.10, 3.12, and 3.14.
          CIBW_BUILD: cp312-*
          CIBW_SKIP: pp*
          # EFTCAMB MOD END
          CIBW_BUILD_VERBOSITY: 1
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Build macos-15 wheels
        if: matrix.os == 'macos-15' || matrix.os == 'macos-15-large'
        env:
          MACOSX_DEPLOYMENT_TARGET: 15
          # EFTCAMB MOD START: keep the dormant macOS-15 recipe consistent with the py3-none wheel build.
          CIBW_BUILD: cp312-*
          CIBW_SKIP: pp*
          # EFTCAMB MOD END
          CIBW_BUILD_VERBOSITY: 1
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Build wheels
        if: matrix.os == 'macos-14' || startsWith(matrix.os, 'ubuntu') || matrix.os == 'windows-latest'
        env:
          MACOSX_DEPLOYMENT_TARGET: 14
          # EFTCAMB MOD START: build a py3-none native-library wheel with CPython 3.12, then validate it on Python 3.10, 3.12, and 3.14.
          CIBW_BUILD: cp312-*
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *musllinux*"
          # EFTCAMB MOD END
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BEFORE_BUILD_LINUX: yum install -y blas-devel lapack-devel
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: |
            wheelhouse/*.whl
          if-no-files-found: error

  build-sdist-and-upload:
    runs-on: ubuntu-latest
    needs: ["build_wheels"]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: "setup.py"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U build twine

      - name: Download wheels from build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist-wheels/

      - name: Build package
        run: |
          python -m build --sdist
          twine check --strict dist/*
          twine check --strict dist-wheels/*
    # EFTCAMB MOD START: construct and retain an sdist on PRs; publication is deferred until all artifacts pass installation tests.
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
    # EFTCAMB MOD END

  # EFTCAMB MOD START: install each built wheel rather than testing the checkout, including CAMB/H-EFTCAMB coexistence.
  test_wheels:
    name: Test wheels on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: ["build_wheels"]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse

      - name: Install and test wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheelhouse/*.whl
          python -m pip install 'camb==1.6.5'
          python -m unittest eftcamb.tests.release_test
          eftcamb --version
  # EFTCAMB MOD END

  # EFTCAMB MOD START: prove the source distribution includes all native build inputs and installs cleanly.
  test_sdist:
    name: Test source distribution
    needs: ["build-sdist-and-upload"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libblas-dev liblapack-dev
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Install and test source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz
          python -m pip install 'camb==1.6.5'
          python -m unittest eftcamb.tests.release_test
          eftcamb --version
  # EFTCAMB MOD END

  # EFTCAMB MOD START: publish only manually requested, already-validated artifacts through Trusted Publishing.
  publish:
    needs: ["test_wheels", "test_sdist"]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository_owner == 'LinSJ-astronomy' &&
      (inputs.publish_target == 'testpypi' ||
      (inputs.publish_target == 'pypi' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - name: Recheck artifacts before upload
        run: |
          python -m pip install --upgrade twine
          twine check --strict dist/*
      - name: Publish to TestPyPI
        if: inputs.publish_target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
      - name: Publish to PyPI
        if: inputs.publish_target == 'pypi' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
  # EFTCAMB MOD END

  # EFTCAMB MOD START: reinstall the exact TestPyPI version independently of build artifacts after upload.
  test_testpypi:
    name: Test TestPyPI release on ${{ matrix.os }}
    needs: ["publish"]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact TestPyPI version
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "eftcamb==${{ inputs.release_version }}"
          python -m pip install 'camb==1.6.5'
          python -m unittest eftcamb.tests.release_test
          eftcamb --version
  # EFTCAMB MOD END
