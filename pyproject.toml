[build-system]
requires = ["setuptools>=77", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "eftcamb"
authors = [{ name = "EFTCAMB developers" }, { name = "Antony Lewis" }]
description = "H-EFTCAMB: Effective Field Theory for CAMB"
keywords = ['cosmology', 'CAMB', 'CMB', 'EFTCAMB', 'modified gravity']
readme = "docs/README_eftcamb_pypi.rst"
license = "LicenseRef-GPLv3-arxiv"
license-files = ["LICENCE.txt", "fortran/eftcamb/LICENSE", "forutils/LICENSE"]
dynamic = ["version"]
requires-python = ">=3.10.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["numpy>=1.22", "scipy>=1.0", "sympy>=1.0", "packaging>=24.2"]

[project.optional-dependencies]
docs = [
    "sphinx>=4.0",
    "sphinx_rtd_theme>=1.0",
    "sphinxcontrib-jquery",
    "sphinxcontrib-programoutput",
    "sphinx_markdown_builder",
    "jupytext",
]
dev = ["ruff>=0.11.0", "pre-commit>=3.0.0", "forformat>=0.1.3"]

[project.scripts]
eftcamb = "eftcamb._command_line:run_command_line"

[project.urls]
Homepage = "https://eftcamb.org"
Documentation = "https://eftcamb.github.io/EFTCAMB/"
Source = "https://github.com/EFTCAMB/EFTCAMB"
Tracker = "https://github.com/EFTCAMB/EFTCAMB/issues"
Licensing = "https://github.com/EFTCAMB/EFTCAMB/blob/eftcamb/LICENCE.txt"

[tool.setuptools.dynamic]
version = { attr = "eftcamb.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["EXE002"]
preview = false

[tool.ruff.lint.per-file-ignores]
"eftcamb/__init__.py" = ["F401", "E402"]
"eftcamb/camb.py" = ["PLC0414"]
"eftcamb/emission_angle.py" = ["E741"]
"fortran/tests/CAMB_test_files.py" = ["E731", "SIM115"]
"**/*.ipynb" = ["F405", "E501", "F403", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.forformat]
mode = "full"
indent = 4
line_length = 120
indent_module = 0
indent_procedure = 0
start_indent = 4
indent-contains = "restart"
indent_select = 4
indent_case = 4
indent_interface = 0
indent_continuation = 4
openmp = 0
# EFTCAMB MOD START: keep the () that BIND(C) requires (02_error_handler.f90);
# forformat 0.1.4 strips it otherwise and breaks the build.
strip-empty-args = false
# EFTCAMB own Fortran sources are not reformatted: forformat 0.1.4 rewrites the Doxygen
# comment markers !> and !< as ! > and ! <, which Doxygen (eftcamb_doc) does not recognize.
extend-exclude = ["fortran/eftcamb/**", "fortran/eftcamb_apps/**"]
# EFTCAMB MOD END

[tool.flake8]
select = [
    "E713",
    "E704",
    "E703",
    "E714",
    "E741",
    "E10",
    "E11",
    "E20",
    "E22",
    "E23",
    "E25",
    "E27",
    "E301",
    "E302",
    "E304",
    "E9",
    "F405",
    "F406",
    "F5",
    "F6",
    "F7",
    "F8",
    "W1",
    "W2",
    "W3",
    "W6",
]
